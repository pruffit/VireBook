name: A site stopped downloading
description: No button appeared, no text was found, or the book is empty or truncated.
title: '[site] '
labels: [site]
body:
  - type: markdown
    attributes:
      value: |
        Sites get restyled — that is routine, and it is fixed one file at a time
        in `src/adapters/<site>.ts`. To fix it we need a link and whatever the
        console says.
  - type: input
    id: url
    attributes:
      label: Link to the work
      description: The page it failed on. If the work is locked, say so in words.
      placeholder: https://ficbook.net/readfic/...
    validations:
      required: true
  - type: dropdown
    id: symptom
    attributes:
      label: What exactly happened
      options:
        - No button appeared at all
        - The button is there, but "No text found"
        - The book downloaded empty
        - The book is truncated — fewer chapters than on the site
        - The file does not open on the reader
        - Something about how the panel looks
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: How many chapters you expected and how many came out, what the panel said, what the console says (F12 → Console).
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131 / Edge 131 / Yandex Browser 24.x
