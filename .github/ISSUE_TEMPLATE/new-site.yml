name: Add a site
description: You would like a dedicated parser for one more site with books.
title: '[new site] '
labels: [new site]
body:
  - type: markdown
    attributes:
      value: |
        The generic reading works on any site, but a dedicated parser is more
        precise: it knows the table of contents, the author and the chapter
        count. See CONTRIBUTING.md — an adapter is one small file.
  - type: input
    id: site
    attributes:
      label: Domain
      placeholder: example.com
    validations:
      required: true
  - type: input
    id: work
    attributes:
      label: Link to any work with several chapters
      description: The markup is captured from it and turned into a test fixture.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What is worth knowing
      description: Whether it needs a login, whether it has bot protection, whether the site serves ready-made files itself, whether it is reachable from your country.
