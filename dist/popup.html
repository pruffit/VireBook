<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VireBook</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 296px; margin: 0; padding: 16px 16px 14px;
    font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #14161a; color: #f4f5f7;
  }
  h1 { font-size: 14px; margin: 0 0 3px; font-weight: 650; }
  .sub { font-size: 12px; color: #9aa2ae; margin: 0 0 14px; }
  fieldset { border: 0; padding: 0; margin: 0 0 14px; }
  legend { font-size: 11.5px; color: #9aa2ae; padding: 0 0 7px; letter-spacing: .02em; }
  label {
    display: flex; align-items: baseline; gap: 8px; padding: 8px 10px;
    border-radius: 9px; cursor: pointer; transition: background .12s ease;
  }
  label:hover { background: #22262d; }
  label input { accent-color: #d8453f; margin: 0; }
  .hint { color: #7e8797; font-size: 11.5px; margin-left: auto; }
  button {
    width: 100%; background: #d8453f; color: #fff; border: 0; cursor: pointer;
    padding: 10px 14px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
    transition: background .12s ease;
  }
  button:hover { background: #e2524c; }
  button:disabled { background: #3a3f48; cursor: default; }
  .note { font-size: 11.5px; color: #7e8797; margin: 10px 0 0; }
  .status { font-size: 12px; margin: 9px 0 0; min-height: 16px; color: #9aa2ae; }
  .status.err { color: #ff9d97; }
</style>
</head>
<body>
  <h1>VireBook</h1>
  <p class="sub">The button appears by itself on a book page.</p>

  <fieldset>
    <legend>Default format</legend>
    <label><input type="radio" name="fmt" value="epub" /> EPUB <span class="hint">Send to Kindle</span></label>
    <label><input type="radio" name="fmt" value="mobi" /> MOBI <span class="hint">over USB</span></label>
    <label><input type="radio" name="fmt" value="fb2" /> FB2 <span class="hint">phone</span></label>
    <label><input type="radio" name="fmt" value="txt" /> TXT <span class="hint">plain text</span></label>
  </fieldset>

  <button id="force">Show the button on this page</button>
  <p class="status" id="status"></p>
  <p class="note">Sites without a dedicated parser fall back to a generic read of the page.</p>

  <script src="popup.js"></script>
</body>
</html>
